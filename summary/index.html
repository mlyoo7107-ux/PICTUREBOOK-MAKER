<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전체 결과 한눈에 보기 — 마음색 그림책 메이커</title>
<link rel="icon" type="image/svg+xml" href="../shared/assets/favicon.svg">
<link rel="stylesheet" href="../shared/colorm.css">
<style>
.sec-title{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sec-title .num{background:var(--soft);color:var(--m);padding:7px 11px;border-radius:999px;font-size:12px;font-weight:900}
.sec-title h2{margin:0;font-size:20px}
.box2{background:var(--tint);border-radius:12px;padding:14px;margin-top:10px;white-space:pre-wrap;line-height:1.7;font-size:14px}
.scene-block{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.scene-block b{color:var(--m)}
.empty{margin-top:10px}
</style>
</head>
<body>
<div id="cmHeader"></div>
<header class="hero">
<p class="eyebrow">SUMMARY</p>
<h1><b>COLOR.M</b> 전체 결과 한눈에 보기</h1>
<p class="sub">지금까지 완성한 기획·스토리·스토리보드·캐릭터·장면·표지·출판 정보 결과를 한 페이지에 모아봅니다.</p>
</header>

<main class="wrap">
<div id="results">
<section class="card" id="mindCard" hidden>
<div class="sec-title"><span class="num">색</span><h2>마음색 · 책 전체 색</h2></div>
<div id="secMind"></div>
</section>

<section class="card">
<div class="sec-title"><span class="num">01</span><h2>기획</h2></div>
<div id="secPlan"></div>
</section>

<section class="card">
<div class="sec-title"><span class="num">02</span><h2>스토리</h2></div>
<div id="secStory"></div>
</section>

<section class="card">
<div class="sec-title"><span class="num">03</span><h2>스토리보드</h2></div>
<div id="secStoryboard"></div>
</section>

<section class="card">
<div class="sec-title"><span class="num">04</span><h2>캐릭터</h2></div>
<div id="secCharacter"></div>
</section>

<section class="card">
<div class="sec-title"><span class="num">05</span><h2>장면</h2></div>
<div id="secScene"></div>
</section>

<section class="card">
<div class="sec-title"><span class="num">06</span><h2>표지</h2></div>
<div id="secCover"></div>
</section>

<section class="card">
<div class="sec-title"><span class="num">07</span><h2>출판 정보</h2></div>
<div id="secPublish"></div>
</section>
</div>

<div class="download-actions">
  <a class="btn ghost" href="../index.html">← 허브로 돌아가기</a>
</div>
</main>

<footer class="wrap">COLOR.M · Color · Design · AI</footer>

<script src="../shared/colorm.js"></script>
<script src="../shared/kr-en-prompt.js"></script>
<script src="../shared/mind.js"></script>
<script src="../shared/canva.js"></script>
<script src="../shared/finish.js"></script>
<script>
const $=id=>document.getElementById(id);
ColorM.renderHeader('cmHeader','summary');
ColorMCanva.mount(document.getElementById('results'));
ColorMFinish.mount(document.querySelector('.download-actions'), {
  pdfLabel:'전체 PDF 저장',
  pdf:function(){ ColorM.saveAsPDF('results','전체보기'); },
  txt:function(){ downloadTXT(); },
  copyAll:function(){ return buildDownloadText(); }
}, 'after');

function emptyState(label, href){
  return '<p class="note empty">아직 완료되지 않았습니다. <a href="'+href+'">'+label+' 만들러 가기 →</a></p>';
}

function renderMind(){
  const lines = (typeof ColorMMind !== 'undefined') ? ColorMMind.summaryLines() : [];
  $('mindCard').hidden = !lines.length;
  if(!lines.length) return;
  const pal = ColorMMind.paletteColors();
  const m = ColorMMind.get();
  const flow = ColorMMind.flowColors();
  const sw = function(c){ return '<i style="display:inline-block;width:34px;height:34px;border-radius:50%;background:'+c+';border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.12)"></i>'; };
  $('secMind').innerHTML =
    '<div style="display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-bottom:12px">' +
      '<div style="display:flex;gap:6px;align-items:center"><span class="help" style="margin:0">마음색</span>'+sw(m.color)+'</div>' +
      (pal ? '<div style="display:flex;gap:6px;align-items:center"><span class="help" style="margin:0">대표 색 3가지</span>'+pal.map(sw).join('')+'</div>' : '') +
      (flow ? '<div style="display:flex;gap:6px;align-items:center"><span class="help" style="margin:0">색 흐름</span>'+flow.map(sw).join('')+'</div>' : '') +
    '</div><div class="box2">'+ColorM.escapeHTML(lines.join('\n'))+'</div>';
}

function render(){
  const project = ColorM.getProject();
  const status = ColorM.stepStatus(project);
  renderMind();

  $('secPlan').innerHTML = status.plan
    ? '<div class="box2">'+ColorM.escapeHTML(project.plan.oneLine||'')+'</div><div class="box2">'+ColorM.escapeHTML(project.plan.planSheet||'')+'</div>'
    : emptyState('기획', '../01-plan/index.html');

  $('secStory').innerHTML = status.story
    ? '<div class="box2">'+ColorM.escapeHTML((project.story.titles||[]).join(' / '))+'</div><div class="box2">'+ColorM.escapeHTML(project.story.summary||'')+'</div>'
    : emptyState('스토리', '../02-story/index.html');

  $('secStoryboard').innerHTML = status.storyboard
    ? '<div class="box2">'+ColorM.escapeHTML(project.storyboard.sceneSummary||'')+'</div>'
      +(project.storyboard.bookManuscript ? '<p class="help" style="margin:14px 0 0">📖 그림책 문장 모음</p><div class="box2">'+ColorM.escapeHTML(project.storyboard.bookManuscript)+'</div>' : '')
    : emptyState('스토리보드', '../03-storyboard/index.html');

  $('secCharacter').innerHTML = status.character
    ? '<div class="box2">'+ColorM.escapeHTML(project.character.oneLine||'')+'</div><div class="box2">'+ColorM.escapeHTML(project.character.fixedInfo||'')+'</div>'
    : emptyState('캐릭터', '../04-character/index.html');

  if(status.scene){
    const items = (project.scenes||[]).map(function(s,i){
      if(!s) return '';
      return '<div class="scene-block"><b>장면 '+String(s.no||i+1).padStart(2,'0')+'</b><br>'+ColorM.escapeHTML(s.sceneDesc||'')+'</div>';
    }).join('');
    $('secScene').innerHTML = items || emptyState('장면', '../05-scene/index.html');
  }else{
    $('secScene').innerHTML = emptyState('장면', '../05-scene/index.html');
  }

  $('secCover').innerHTML = status.cover
    ? '<div class="box2">'+ColorM.escapeHTML(project.cover.coverDesc||'')+'</div>'
    : emptyState('표지', '../06-cover/index.html');

  $('secPublish').innerHTML = status.publish
    ? '<div class="box2">'+ColorM.escapeHTML((project.publish.outputs||{}).bib||'')+'</div>'
      +'<p class="help" style="margin:14px 0 0">📖 뒤표지 문구</p><div class="box2">'+ColorM.escapeHTML((project.publish.outputs||{}).back||'')+'</div>'
    : emptyState('출판 정보', '../07-publish/index.html');
}
render();

function buildDownloadText(){
  const project = ColorM.getProject();
  const status = ColorM.stepStatus(project);
  const lines = ['COLOR.M 마음색 그림책 메이커 — 전체 결과', '프로젝트명: '+project.projectName, '================================', ''];

  const mindLines = (typeof ColorMMind !== 'undefined') ? ColorMMind.summaryLines() : [];
  if(mindLines.length){ lines.push('[마음색 · 책 전체 색]'); lines.push(mindLines.join('\n')); lines.push(''); }

  lines.push('[01 기획]');
  lines.push(status.plan ? (project.plan.oneLine+'\n\n'+project.plan.planSheet) : '아직 완료되지 않았습니다.');
  lines.push('');

  lines.push('[02 스토리]');
  lines.push(status.story ? ((project.story.titles||[]).join(' / ')+'\n\n'+project.story.summary) : '아직 완료되지 않았습니다.');
  lines.push('');

  lines.push('[03 스토리보드]');
  if(status.storyboard){
    lines.push(project.storyboard.sceneSummary);
    if(project.storyboard.bookManuscript){ lines.push(''); lines.push('[그림책 문장 모음]'); lines.push(project.storyboard.bookManuscript); }
  }else{
    lines.push('아직 완료되지 않았습니다.');
  }
  lines.push('');

  lines.push('[04 캐릭터]');
  lines.push(status.character ? (project.character.oneLine+'\n\n'+project.character.fixedInfo) : '아직 완료되지 않았습니다.');
  lines.push('');

  lines.push('[05 장면]');
  if(status.scene){
    (project.scenes||[]).forEach(function(s,i){
      if(!s) return;
      lines.push('장면 '+String(s.no||i+1).padStart(2,'0')+': '+s.sceneDesc);
    });
  }else{
    lines.push('아직 완료되지 않았습니다.');
  }
  lines.push('');

  lines.push('[06 표지]');
  lines.push(status.cover ? project.cover.coverDesc : '아직 완료되지 않았습니다.');
  lines.push('');

  lines.push('[07 출판 정보]');
  if(status.publish){
    const o = project.publish.outputs || {};
    lines.push(o.bib || '');
    lines.push('');
    lines.push('[판권면 문구]'); lines.push(o.colophon || '');
    lines.push('');
    lines.push('[뒤표지 문구]'); lines.push(o.back || '');
  }else{
    lines.push('아직 완료되지 않았습니다.');
  }

  return lines.join('\n');
}
function downloadTXT(){
  const project = ColorM.getProject();
  ColorM.downloadTXT('COLOR.M_'+project.projectName+'_전체결과.txt', buildDownloadText());
}
</script>
</body>
</html>
